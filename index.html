<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#344765">
  <meta name="description" content="作业清：简洁的学生作业管理与班级学情记录工具。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="作业清">
  <title>作业清 · 学生作业管理</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-check-square" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 2.5 2.5L16 9"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 9h8M8 13h5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h7M15 18h5"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="13" cy="18" r="2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 21h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8zM5 3l.6 1.7L7 5l-1.4.6L5 7l-.6-1.4L3 5l1.4-.3z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19z"/><path d="M12 9v5M12 17h.01"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v5M14 11v5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v2a4 4 0 0 0 4 4M16 6h4v2a4 4 0 0 1-4 4M12 13v5M8 21h8M9 18h6"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4zM20 4h-3a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h3z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.2A10.8 10.8 0 0 1 12 4c7 0 10 8 10 8a16 16 0 0 1-2.1 3.1M6.6 6.6C4.3 8.4 3 10.6 2 12c0 0 3 8 10 8a10.9 10.9 0 0 0 5.4-1.4"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 5h12l-2 4 2 4H5"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M7 3v6h8V3M7 21v-7h10v7"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <button class="brand" type="button" data-action="go-home" aria-label="返回总览">
        <span class="brand-mark">清</span>
        <span class="brand-copy">
          <strong>作业清</strong>
          <small>学生作业管理</small>
        </span>
      </button>

      <nav class="side-nav">
        <button type="button" class="nav-item is-active" data-view="dashboard">
          <svg class="icon"><use href="#i-home"></use></svg>
          <span>今日总览</span>
        </button>
        <button type="button" class="nav-item" data-view="register">
          <svg class="icon"><use href="#i-check-square"></use></svg>
          <span>作业登记</span>
        </button>
        <button type="button" class="nav-item" data-view="feedback">
          <svg class="icon"><use href="#i-message"></use></svg>
          <span>班级反馈</span>
        </button>
        <button type="button" class="nav-item" data-view="analytics">
          <svg class="icon"><use href="#i-chart"></use></svg>
          <span>学生画像</span>
        </button>
        <button type="button" class="nav-item" data-view="settings">
          <svg class="icon"><use href="#i-sliders"></use></svg>
          <span>评价设置</span>
        </button>
      </nav>

      <div class="sidebar-note">
        <span class="note-icon"><svg class="icon"><use href="#i-sparkles"></use></svg></span>
        <strong>记录清楚，沟通从容</strong>
        <p>作业、反馈和学情记录集中在这里。</p>
      </div>

      <button class="profile-button" type="button" data-view="settings">
        <span class="avatar">林</span>
        <span>
          <strong>教师</strong>
          <small>尚未设置班级</small>
        </span>
        <svg class="icon profile-chevron"><use href="#i-chevron-right"></use></svg>
      </button>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="page-heading">
          <button type="button" class="mobile-menu" data-action="toggle-menu" aria-label="打开菜单">
            <svg class="icon"><use href="#i-menu"></use></svg>
          </button>
          <div>
            <div class="eyebrow" id="page-eyebrow">作业管理</div>
            <h1 id="page-title">今日总览</h1>
            <p id="page-subtitle">把今天的作业进度，放进一张清晰的图里。</p>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" class="class-switcher" data-action="open-class-picker">
            <span class="class-dot"></span>
            <span>尚未设置班级</span>
            <svg class="icon"><use href="#i-chevron-down"></use></svg>
          </button>
          <button type="button" class="icon-button notification-button" data-action="show-tips" aria-label="今日提醒">
            <svg class="icon"><use href="#i-bell"></use></svg>
            <span class="notification-dot"></span>
          </button>
          <button type="button" class="primary-button top-new-task" data-action="new-task">
            <svg class="icon"><use href="#i-plus"></use></svg>
            登记新作业
          </button>
        </div>
      </header>

      <main id="app" class="page-content" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js" defer></script>
  <script src="cloud.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
